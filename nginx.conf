# One line per request: shows the city sent by the client and the city forwarded
log_format gateway '$remote_addr "$request" $status client_city="$http_x_city" city=$city upstream=$upstream_addr';

# Unknown host: answer 404 and never call a service
server {
  listen 80 default_server;
  server_name _;
  return 404;
}

# Lille. To add a city later, copy this block and change the host,
# the city and the service names.
server {
  listen 80;
  server_name lille.shoploc.local;
  root /usr/share/nginx/html;
  access_log /var/log/nginx/access.log gateway;

  # The city is decided here from the host name. proxy_set_header replaces any
  # X-City sent by the browser, so a forged header is never forwarded.
  set $city lille;
  proxy_set_header X-City $city;

  # React application pages
  location / {
    try_files $uri /index.html;
  }

  # API: each prefix goes to its own service (original path is kept)
  location /api/users    { proxy_pass http://user-service-lille:8080; }
  location /api/stores   { proxy_pass http://store-service-lille:8080; }
  location /api/products { proxy_pass http://store-service-lille:8080; }
  location /api/orders   { proxy_pass http://order-service-lille:8080; }
}
